<!doctype html><meta charset="utf-8"><title>로고 색 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
 body{font-family:"Pretendard Variable",Pretendard,system-ui;margin:0;padding:28px 24px;background:#fff;color:#1d2733}
 h3{font-size:14px;color:#9298a2;margin:22px 0 8px;font-weight:600}
 .row{display:flex;align-items:center;gap:44px;margin-bottom:6px}
 .bar{border-bottom:1px solid #e5e7eb;padding:12px 20px;display:flex;align-items:center;gap:24px;background:#fff}
 .cap{font-size:12.5px;color:#9298a2}
 img.big{height:150px}img.real{height:62px}
</style>
<h3>1) 확대 비교 (150px)</h3>
<div class="row">
  <div><img class="big" src="logo_stack.png?v=1"><div class="cap">지금 (#E06A39 계열)</div></div>
  <div><img class="big" src="logo_stack_new.png?v=1"><div class="cap">새 색 (#F28C28)</div></div>
</div>
<h3>2) 실제 상단 바 크기 (62px)</h3>
<div class="bar"><img class="real" src="logo_stack.png?v=1"><span class="cap">지금</span></div>
<div class="bar"><img class="real" src="logo_stack_new.png?v=1"><span class="cap">새 색 #F28C28</span></div>
